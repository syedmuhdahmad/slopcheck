name: 🎯 False positive
description: slopcheck flagged code that is actually fine
labels: ["false-positive", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        False positives are the #1 thing we want to fix, so thank you!
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: "SLOP020"
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code that was flagged
      description: The smallest snippet that reproduces it. Remove anything private.
      render: python
    validations:
      required: true
  - type: textarea
    id: why-ok
    attributes:
      label: Why is this code correct?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: slopcheck version
    validations:
      required: true
