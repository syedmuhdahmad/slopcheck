[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "slopfence"
dynamic = ["version"]
description = "A fast, deterministic quality gate for AI-assisted code: catches hallucinated packages, fake tests, stub functions, duplicate helpers and chat leftovers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "syedmuhdahmad" }]
keywords = ["linter", "ai", "llm", "code-quality", "static-analysis", "supply-chain-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[project.scripts]
slopfence = "slopfence.cli:main"

[project.urls]
Homepage = "https://github.com/syedmuhdahmad/slopfence"
Issues = "https://github.com/syedmuhdahmad/slopfence/issues"
Changelog = "https://github.com/syedmuhdahmad/slopfence/blob/main/CHANGELOG.md"
Source = "https://github.com/syedmuhdahmad/slopfence"

[tool.hatch.version]
path = "src/slopfence/__init__.py"

# Keep the sdist to what's needed to build and test the package: no demo GIF, logos
# or CI fixtures (the fixture's fake requirements.txt could confuse sdist scanners).
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/slopfence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Deliberately sloppy project used by the GitHub Action test.
extend-exclude = [".github/action-fixture"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
